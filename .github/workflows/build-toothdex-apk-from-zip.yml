
name: Build ToothDex APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'toothdex-android-v0.9-apk-project.zip'
      - '.github/workflows/build-toothdex-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q toothdex-android-v0.9-apk-project.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: toothdex
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toothdex-debug-apk
          path: toothdex/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
